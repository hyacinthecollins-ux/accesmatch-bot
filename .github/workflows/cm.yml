name: CM monfootballfr

on:
  schedule:
    - cron: "*/15 * * * *"    # toutes les 15 min (GitHub le retarde souvent de plusieurs heures : un déclencheur externe est prévu)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
    inputs:
      mode:
        description: "normal = programme vraiment | dry-run = simule | samples = exemples de posts | diag = diagnostic"
        type: choice
        options: [normal, dry-run, samples, diag]
        default: diag

permissions:
  contents: write
  actions: write            # pour réveiller le robot d'affiches (matchday.yml)

concurrency:
  group: cm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # toujours la dernière version : une exécution en attente ne doit pas repartir d'un état périmé (doublons)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Community manager
        run: python cm.py ${{ inputs.mode == 'dry-run' && '--dry-run' || inputs.mode == 'samples' && '--samples' || inputs.mode == 'diag' && '--diag' || '' }}
        # Interrupteur d'urgence : "enabled": false dans cm_config.json.
        # Code 2 = clé OpenAI refusée / crédit épuisé : l'étape devient rouge et GitHub envoie un email d'alerte.

      - name: Sauvegarde de l'état
        if: always()
        run: |
          git config user.name "accesmatch-bot"
          git config user.email "accesmatch-bot@users.noreply.github.com"
          git add cm_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "etat cm"
            git pull --rebase
            git push
          fi

      # Le déclencheur de GitHub pour les affiches est lent (plusieurs heures) : ce robot-ci est réveillé toutes les
      # 10 min par le Worker Cloudflare, il réveille donc les affiches (J-24h, H-1, Telegram) une fois par demi-heure.
      - name: Réveil du robot d'affiches
        if: always() && inputs.mode != 'dry-run' && inputs.mode != 'samples' && inputs.mode != 'diag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(date -u +%-M)
          if [ $((m % 30)) -lt 10 ]; then
            gh workflow run matchday.yml --ref main || echo "réveil des affiches impossible"
          fi
